# genhub2.quanterall.com on the edge server (65.108.62.183 = 10.55.66.1), applied there by its administrator: TLS
# ends here and the requests go to the build host over the VPN, as for quanterall.com. Put this server block in the
# edge's nginx (e.g. /etc/nginx/sites-available/genhub2.quanterall.com, linked from sites-enabled), check with
# `sudo nginx -t`, reload, then issue the certificate:
#   sudo certbot --nginx --non-interactive --agree-tos --no-redirect -d genhub2.quanterall.com
# (certbot adds the listen 443 ssl lines and the certificate paths to this block). The redirect from HTTP to HTTPS is
# done on the build host, on X-Forwarded-Proto, so that certbot's challenge on port 80 is answered here.
server {
    listen 80;
    listen [::]:80;
    server_name genhub2.quanterall.com;

    # uploads of genomes and read files: up to 100 MB
    client_max_body_size 101m;

    location / {
        proxy_pass http://10.55.66.2:8130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the site's live events (WebSocket /ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
    }
}
