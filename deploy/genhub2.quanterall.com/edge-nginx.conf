# genhub2.quanterall.com on the edge server (65.108.62.183 = 10.55.66.1), as applied there on 20 November 2026 in
# /etc/nginx/sites-available/genhub2.quanterall.com (linked from sites-enabled). TLS ends here; the requests go to the
# build host over the VPN. The certificate was issued with
#   sudo certbot --nginx --non-interactive --agree-tos --no-redirect -d genhub2.quanterall.com
# which added the "managed by Certbot" lines below; certbot renews it on its own.
map $http_upgrade $connection_upgrade_gh2 {
    default upgrade;
    ''      close;
}
# the visitor's address: Cloudflare's header when it is in front, otherwise the peer
map $http_cf_connecting_ip $client_ip_gh2 {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name genhub2.quanterall.com;

    # uploads of genomes and read files: up to 100 MB
    client_max_body_size 101m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://10.55.66.2:8130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_gh2;
        proxy_set_header X-Forwarded-For $client_ip_gh2;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the site's live events (WebSocket /ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_gh2;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/genhub2.quanterall.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/genhub2.quanterall.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
