# genhub2.quanterall.com on this machine (10.55.66.2:8130). HTTPS ends at the edge server (10.55.66.1 =
# 65.108.62.183), which proxies here over the VPN and sets X-Forwarded-Proto and X-Forwarded-For (edge-nginx.conf).
#   /                 the public page (www/)
#   /app/             the GenHub2 site's page (login with password and one-time code)
#   /static/ /api/ /ws /beacon/ /ga4gh/   the GenHub2 node
#   /metrics          not served here

# the visitor's address: the edge's X-Forwarded-For, trusted from the edge only
set_real_ip_from 10.55.66.1;
real_ip_header   X-Forwarded-For;

# logins: 10 a minute per visitor, bursts of 5 (the node also locks an account after 5 failures)
limit_req_zone $binary_remote_addr zone=gh2login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gh2api:10m rate=20r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $uri $gh2_cache {
    ~^/(api|ws|beacon|ga4gh)                    "no-store";
    ~*\.(css|js)$                               "public, max-age=3600, must-revalidate";
    ~*\.(svg|png|ico|woff2?)$                   "public, max-age=86400";
    default                                     "no-cache";
}

upstream genhub2 { server 172.31.130.20:8480; }

server {
    listen 80;
    server_name _;
    root /var/www/genhub2;
    server_tokens off;
    client_max_body_size 101m;

    # plain HTTP from the edge goes to HTTPS
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    add_header Cache-Control $gh2_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' wss://genhub2.quanterall.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = / { try_files /index.html =404; }
    location = /app { return 301 /app/; }

    # the GenHub2 node
    location = /app/ {
        proxy_pass http://genhub2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/login {
        limit_req zone=gh2login burst=5 nodelay;
        proxy_pass http://genhub2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/(static|api|beacon|ga4gh)/ {
        limit_req zone=gh2api burst=100 nodelay;
        proxy_pass http://genhub2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
    location = /ws {
        proxy_pass http://genhub2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
    location = /metrics { return 404; }

    # the film (GENHUB2_SITE_DATA/media), with byte ranges for seeking
    location /film/ {
        alias /var/www/genhub2-media/;
        types { video/mp4 mp4; text/vtt vtt; image/jpeg jpg; }
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / { try_files $uri =404; }
    error_page 404 /404.html;
}
